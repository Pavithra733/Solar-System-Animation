
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
        }

        #container {
            height: 100vh;
            min-height: 400px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: black;
            position: relative;
            overflow: hidden;
        }

        .sun {
            height: 100px;
            width: 100px;
            background-image: url(https://pngimg.com/uploads/sun/sun_PNG13424.png);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .circle1 {
            width: 150px;
            height: 150px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: rotate 16s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .mercury {
            width: 30px;
            height: 30px;
            background-image: url(https://static.vecteezy.com/system/resources/previews/048/412/668/non_2x/mercury-planet-on-transparent-backdrop-free-png.png);
            background-size: 100%;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .circle2 {
            width: 230px;
            height: 230px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;

            transform: translate(-50%, -50%);
            animation: rotate 18s linear infinite;
        }

            background-size: 100%;
            background-repeat: no-repeat;

            .circle8 {

            }

            .sun {

            }

            .mercury,
            .venus,
            .earth,
            .mars {
                width: 20px;

            }

            .jupiter {
                width: 28px;

            }

            .saturn {

            .uranus {

            .neptune {

        }
    </style>
</head>
